# CPSA scripted trial protocol (schema v1).
#
# The protocol is run once per distance block in `distances_cm`, in the listed
# order. Before each block the runner asks the operator to set that distance.
# Every trial is written to trials.jsonl with its `distance_cm`.
#
# Scaling:
#   - `reps` is the number of repetitions per hand; a class with `hand: both`
#     produces `reps` left-hand and `reps` right-hand trials.
#   - A real session uses the values below (about 35-40 min for all three
#     distances). For a short dry run set `reps: 1` and keep one distance, e.g.
#     `distances_cm: [55]` (about 3 min).
#   - Trial order is shuffled deterministically from `seed`; the same seed and
#     the same file always produce the same order.
#
# Safety: simulate every contact gently. Never make real hits. Use the foam head
# for any impact-like class.
seed: 20261106
distances_cm: [45, 55, 65]
pre_s: 1.0          # frames recorded before the GO cue
post_s: 1.0         # frames recorded after the trial ends
rest_s: 2.0         # pause between trials inside a block
cue_lead_s: 3.0     # instruction/countdown before the GO cue
notes: "Simulate gently; no real hits; use the foam head for impacts."

classes:
  # Dangerous behaviours.
  - {name: fist_temple, category: dangerous, hand: both, target: temple, reps: 3, duration_s: 3.0}
  - {name: fist_forehead, category: dangerous, hand: both, target: forehead, reps: 3, duration_s: 3.0}
  - {name: slap_cheek, category: dangerous, hand: both, target: cheek, reps: 3, duration_s: 3.0}
  - {name: finger_eye, category: dangerous, hand: both, target: eye, reps: 3, duration_s: 2.0}
  - {name: press_eye, category: dangerous, hand: both, target: eye, reps: 3, duration_s: 2.0}
  - {name: hand_mouth_bite, category: dangerous, hand: both, target: mouth, reps: 3, duration_s: 3.0}
  - {name: scratch_face, category: dangerous, hand: both, target: face, reps: 3, duration_s: 3.0}

  # Confounders: similar movements that are not dangerous stereotypies.
  - {name: scratch_nose, category: confounder, hand: both, target: nose, reps: 3, duration_s: 2.0}
  - {name: adjust_glasses, category: confounder, hand: both, target: glasses, reps: 3, duration_s: 2.0}
  - {name: drink, category: confounder, hand: R, target: bottle, reps: 3, duration_s: 3.0}
  - {name: phone_ear, category: confounder, hand: R, target: ear, reps: 3, duration_s: 3.0}
  - {name: touch_hair, category: confounder, hand: both, target: hair, reps: 3, duration_s: 2.0}
  - {name: cover_yawn, category: confounder, hand: R, target: mouth, reps: 3, duration_s: 3.0}
  - {name: chin_rest, category: confounder, hand: both, target: chin, reps: 3, duration_s: 3.0}

  # Non-dangerous stereotypies.
  - {name: hand_flapping, category: stereotypy, hand: both, target: none, reps: 3, duration_s: 3.0}
  - {name: rocking, category: stereotypy, hand: both, target: none, reps: 3, duration_s: 3.0}

  # Baseline.
  - {name: idle, category: idle, hand: both, target: none, reps: 3, duration_s: 5.0}
