[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpsa-ml"
version = "0.1.0"
description = "Dataset, training and DPU-compatibility toolchain for the CPSA vision models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6",
    "pillow>=10",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics==8.4.203",
    "onnx>=1.16,<2",
]

[project.optional-dependencies]
qat = ["brevitas==0.13.4"]
teacher = ["rtmlib==0.0.16", "onnxruntime>=1.17"]
pseudolabel = ["rtmlib==0.0.16", "onnxruntime>=1.17"]
sources = ["gdown>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cpsa-ml-autolabel = "cpsa_ml.pseudolabel:main"
cpsa-ml-halfbust = "cpsa_ml.datasets.halfbust:main"
cpsa-ml-onnx-check = "cpsa_ml.onnx_check:main"
cpsa-ml-train = "cpsa_ml.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsa_ml"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "cpsa_ml/configs"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "configs",
    "tests",
    "notebooks",
    "scripts",
    "README.md",
    "pyproject.toml",
]

# Use CPU PyTorch locally; pip on Kaggle ignores [tool.uv] and gets the CUDA
# build that the T4 workers need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long smoke test, enabled with CPSA_ML_SLOW=1"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cpsa_ml"]
