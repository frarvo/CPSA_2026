# Ultralytics YOLOv8-pose with LeakyReLU(0.1015625) activations (DPU-friendly).
# License: AGPL-3.0 (Ultralytics). See ml/README.md.
#
# The top-level `activation` key is read by Ultralytics parse_model and applied
# to every Conv block in the backbone, neck and detection/keypoint head.
# No attention blocks are used.
#
# The slope is 26/256 = 0.1015625, the leaky-ReLU alpha the DPUCZDX8G supports
# natively (other slopes are not fusable into the DPU convolution). It is the
# trained alternative to ReLU in the activation matrix
# (`tools/vitis/variants.sh`); accuracy is measured separately.
#
# kpt_shape is replaced at build time by cpsa_ml.models for COCO17/HALFBUST_62.

nc: 1 # number of classes
kpt_shape: [17, 3] # overridden per keypoint schema
activation: nn.LeakyReLU(0.1015625)
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 21 (P5/32-large)
  - [[15, 18, 21], 1, Pose, [nc, kpt_shape]] # Pose(P3, P4, P5)
