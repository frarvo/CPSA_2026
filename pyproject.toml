[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpsa"
version = "0.1.0"
description = "IMU stereotypy detection with vision-gated multimodal actuation for the Kria KV260."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
board = [
    "blue-st-sdk",
    "bluepy",
    "metawear",
    "flux_led",
    "playsound==1.2.2",  # 1.3.0 ships a broken sdist that cannot be built or locked
    "dbus-fast",
]
camera = [
    "linuxpy>=0.25",
]
recorder = [
    "pillow",
]
vision = [
    "onnxruntime",
    "opencv-python-headless",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
cpsa-board = "cpsa.board.__main__:main"
cpsa-record = "cpsa.recorder.__main__:main"
cpsa-replay-imu = "cpsa.board.replay:main"
cpsa-replay-vision = "cpsa.board.vision_replay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["target: requires aarch64/KV260 and the native classifier libraries"]
addopts = "-m 'not target'"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["cpsa.adapters", "cpsa.adapters.*", "cpsa.board", "cpsa.board.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "blue_st_sdk", "blue_st_sdk.*",
    "bluepy", "bluepy.*",
    "mbientlab", "mbientlab.*",
    "flux_led", "flux_led.*",
    "playsound",
    "dbus_fast", "dbus_fast.*",
    "yaml",
    "linuxpy", "linuxpy.*",
]
ignore_missing_imports = true
